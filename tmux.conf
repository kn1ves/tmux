# Unbind the default prefix
unbind C-b

# Set the new prefix to Ctrl+Space
set -g prefix C-Space
bind C-Space send-prefix

# Correct terminal info so nvim renders efficiently
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",*:Tc"          # true color passthrough

# Kill input lag
set -sg escape-time 0
set -g focus-events on

set-window-option -g mode-keys vi

# Bind 'v' to begin selection (like visual mode)
bind-key -T copy-mode-vi v send-keys -X begin-selection

# Bind 'y' to copy selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# ─── Aura theme ─────────────────────────────────────────────────────────────
# Matches nvim: aura-dark + Normal guibg=#000000
# purple #a277ff · green #61ffca · orange #ffca85 · white #edecee
# muted #6d6d6d · fading-purple #3d375e

set -g status-style "bg=#000000,fg=#6d6d6d"
set -g status-interval 5

# Left: session name as a purple pill
set -g status-left "#[fg=#a277ff,bg=#000000]#[fg=#000000,bg=#a277ff,bold]  #S #[fg=#a277ff,bg=#000000]"
set -g status-left-length 40

# Right: date + time
set -g status-right "#[fg=#6d6d6d] %a %d %b   #[fg=#a277ff,bold]%H:%M "
set -g status-right-length 40

# Windows: muted when inactive, purple pill when active
set -g window-status-format "#[fg=#6d6d6d,bg=#000000]  #I  #{b:pane_current_command} "
set -g window-status-current-format "#[fg=#a277ff,bg=#000000]#[fg=#000000,bg=#a277ff,bold]  #I  #{b:pane_current_command} #[fg=#a277ff,bg=#000000]"
set -g window-status-separator ""

# Panes: fading purple borders, purple for the focused pane
set -g pane-border-style "fg=#3d375e"
set -g pane-active-border-style "fg=#a277ff"

# Copy-mode selection, prompts and clock
set -g mode-style "bg=#3d375e,fg=#edecee"
set -g message-style "bg=#3d375e,fg=#edecee"
set -g message-command-style "bg=#3d375e,fg=#edecee"
set -g clock-mode-colour "#a277ff"
