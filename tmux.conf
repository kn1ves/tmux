# Unbind the default prefix
unbind C-b

# Set the new prefix to Ctrl+Space
set -g prefix C-Space
bind C-Space send-prefix

# Correct terminal info so nvim renders efficiently
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",*:Tc"          # true color passthrough

# Kill input lag
set -sg escape-time 0
set -g focus-events on

# Windows and panes start at 1; renumber after closing a window
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set-window-option -g mode-keys vi

# Bind 'v' to begin selection (like visual mode)
bind-key -T copy-mode-vi v send-keys -X begin-selection

# Bind 'y' to copy selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# ─── Aura theme ─────────────────────────────────────────────────────────────
# Matches nvim: aura-dark + Normal guibg=#000000
# purple #a277ff · orange #ffca85 · red #ff6767 · green #61ffca · white #edecee
# muted #6d6d6d · fading-purple #3d375e

set -g status-style "bg=#000000,fg=#6d6d6d"
set -g status-interval 5

# Left: session name as an orange pill
set -g status-left "#[fg=#ffca85,bg=#000000]#[fg=#000000,bg=#ffca85,bold]  #S #[fg=#ffca85,bg=#000000]"
set -g status-left-length 40

# Right: mode indicators + date + time
# (PREFIX shows in red while C-Space is held, COPY in green while in copy-mode;
# styles are split into separate #[...] blocks — commas inside a single
# #[fg,bg] break tmux's ?cond,a,b conditional parser)
set -g status-right "#{?client_prefix,#[fg=#000000]#[bg=#ff6767]#[bold] PREFIX #[fg=#ff6767]#[bg=#000000],}#{?pane_in_mode,#[fg=#000000]#[bg=#61ffca]#[bold] COPY #[fg=#61ffca]#[bg=#000000],}#[fg=#6d6d6d] %a %d %b   #[fg=#a277ff,bold]%H:%M "
set -g status-right-length 40

# Windows: muted when inactive (red while a bell is ringing),
# purple pill when active, orange when zoomed
set -g window-status-format "#{?window_bell_flag,#[fg=#000000]#[bg=#ff6767]#[bold]  #I  #{b:pane_current_command} #[fg=#ff6767]#[bg=#000000],#[fg=#6d6d6d]#[bg=#000000]  #I  #{b:pane_current_command} }"
set -g window-status-current-format "#{?window_zoomed_flag,#[fg=#ffca85]#[bg=#000000]#[fg=#000000]#[bg=#ffca85]#[bold]  #I  #{b:pane_current_command} #[fg=#ffca85]#[bg=#000000],#[fg=#a277ff]#[bg=#000000]#[fg=#000000]#[bg=#a277ff]#[bold]  #I  #{b:pane_current_command} #[fg=#a277ff]#[bg=#000000]}"
set -g window-status-separator ""

# Panes: fading purple borders, purple for the focused pane,
# pane index drawn into the border lines
set -g pane-border-style "fg=#3d375e"
set -g pane-active-border-style "fg=#a277ff"
set -g pane-border-lines number

# Copy-mode selection, prompts and clock
set -g mode-style "bg=#3d375e,fg=#edecee"
set -g message-style "bg=#3d375e,fg=#edecee"
set -g message-command-style "bg=#3d375e,fg=#edecee"
set -g clock-mode-colour "#a277ff"
